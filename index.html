<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anggaran AI/AO UP2D Jatim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: bilah atas + navigasi tab; tiap tab satu tampilan kerja. Ringkasan di atas, detail di bawah. */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#14212e; --muted:#5b6b7b; --line:#dbe2ea;
  --accent:#0b5c8f; --accent-soft:#e3eff7; --good:#1c7a4a; --good-soft:#e2f3ea;
  --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#b3261e; --bad-soft:#fbe5e3;
  --bar1:#0b5c8f; --bar2:#57a3cf; --bar3:#c9d6e2;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1720; --panel:#16212c; --ink:#e4ebf2; --muted:#93a4b5; --line:#2a3846;
  --accent:#5db3e6; --accent-soft:#16324a; --good:#5fd197; --good-soft:#123426;
  --warn:#f0b54a; --warn-soft:#3a2c10; --bad:#ff8a80; --bad-soft:#3d1a18;
  --bar1:#5db3e6; --bar2:#2f7cad; --bar3:#33475a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1720; --panel:#16212c; --ink:#e4ebf2; --muted:#93a4b5; --line:#2a3846;
  --accent:#5db3e6; --accent-soft:#16324a; --good:#5fd197; --good-soft:#123426;
  --warn:#f0b54a; --warn-soft:#3a2c10; --bad:#ff8a80; --bad-soft:#3d1a18;
  --bar1:#5db3e6; --bar2:#2f7cad; --bar3:#33475a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body)}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font:600 18px var(--display);margin:0;letter-spacing:.2px}
header .sub{color:var(--muted);font-size:12px}
.grow{flex:1}
nav{display:flex;gap:4px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav a{padding:10px 12px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav a.on{color:var(--accent);border-bottom-color:var(--accent)}
main{padding:20px;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h2{font:600 20px var(--display);margin:0;text-wrap:balance}
h3{font:600 15px var(--display);margin:0 0 8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .l{color:var(--muted);font-size:12px}.tile .v{font:600 22px var(--display);font-variant-numeric:tabular-nums}
.tile .n{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;background:var(--bg);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--accent-soft)}
tr.tot td{font-weight:600;border-top:2px solid var(--line)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.mute{background:var(--bg);color:var(--muted)}
.meter{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--accent)}.meter i.over{background:var(--bad)}
button,.btn{font:500 13px var(--body);padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:13px var(--body);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:100%}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.form .wide{grid-column:1/-1}
.msg{padding:8px 12px;border-radius:6px;font-size:13px}
.msg.bad{background:var(--bad-soft);color:var(--bad)}.msg.warn{background:var(--warn-soft);color:var(--warn)}.msg.good{background:var(--good-soft);color:var(--good)}.msg.info{background:var(--accent-soft);color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.overlay.on{display:flex}
.modal{background:var(--panel);border-radius:10px;max-width:960px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.toast{position:fixed;right:16px;bottom:16px;z-index:30;max-width:360px}
.muted{color:var(--muted)}.mono{font-family:var(--mono)}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:flex;flex-direction:column;gap:10px}
.timeline div{position:relative}.timeline div::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.chartbox{position:relative;height:260px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:500px){main{padding:12px}header,nav{padding-left:12px;padding-right:12px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div><h1>Pengelolaan Anggaran AI/AO</h1><div class="sub">UP2D Jawa Timur · Tahun anggaran 2026</div></div>
  <div class="grow"></div>
  <span id="mode" class="chip mute">Memuat</span>
  <span id="who" class="muted"></span>
  <button id="btnReload" type="button">Muat ulang</button>
  <button id="btnSetting" type="button">Pengaturan</button>
</header>
<nav id="nav">
  <a href="#dashboard">Dashboard</a><a href="#pagu">Pagu PRK</a><a href="#paket">Paket</a><a href="#kontrak">Kontrak dan amandemen</a>
  <a href="#khs">KHS</a><a href="#material">Rencana material</a><a href="#progres">Progres fisik</a><a href="#bayar">Pembayaran</a>
</nav>
<main id="view"><div class="panel">Memuat data…</div></main>
<div class="overlay" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* ===== Konfigurasi ===== */
const DEMO_DATA = /*__DEMO_DATA__*/null;
const TODAY = new Date().toISOString().slice(0,10);
const UP3 = ['MDR','JMB','PNG','PSR','MDN','SBS','MJK','MLG','BJG','SBU','SDA','KDR','BWI','GSK','STB','SBB'];
const UP3_NAMA = {MDR:'Madura',JMB:'Jember',PNG:'Ponorogo',PSR:'Pasuruan',MDN:'Madiun',SBS:'Surabaya Selatan',MJK:'Mojokerto',MLG:'Malang',BJG:'Bojonegoro',SBU:'Surabaya Utara',SDA:'Sidoarjo',KDR:'Kediri',BWI:'Banyuwangi',GSK:'Gresik',STB:'Situbondo',SBB:'Surabaya Barat'};
const STATUS = ['Rencana','Menunggu SKKI','Persiapan','ND User','ND Manajer','Pengadaan','Terkontrak','Pelaksanaan','Siap tagih','Terbayar','Batal'];
const PRE = STATUS.slice(0,6);
const JALUR = ['Kontrak Rinci (KHS)','Pengadaan Langsung','Penunjukan Langsung','SMART SOSSYS','Repeat Order','Tender Terbuka'];
const BIDANG = ['FASOP','HAR','REN','K3L'];
const KAT = ['Jasa','Material','Peralatan'];
const ALASAN_AMD = ['Rekomposisi pekerjaan','Tambah lokasi','Kurang lokasi','Kendala material','Kondisi lapangan','Perpanjangan waktu','Lainnya'];
// PRK, sub PRK, pagu, dan KHS dibaca dari workbook dan diubah langsung di sheet sumbernya.
const WRITE = {'Admin Ren':['PAKET','KONTRAK','AMANDEMEN','BOQ','PROGRES','BAYAR','PLOT_AKI','KATALOG','RENCANA_MATERIAL','DISPOSISI','PROGNOSA'],'PIC User':['PAKET','BOQ','DISPOSISI','KONTRAK','AMANDEMEN','PROGRES','PROGNOSA'],'Manajer':['DISPOSISI'],'Viewer':[]};
const canWriteAny = sh => USER && (WRITE[USER.peran]||[]).includes(sh);
let CFG = {api:'',token:''};
try{ CFG = Object.assign(CFG, JSON.parse(localStorage.getItem('aiao_cfg')||'{}')); }catch(e){}
let USER = null, D = null, C = null, chart = null;

/* ===== Utilitas ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const rp = v => Math.round(num(v)).toLocaleString('id-ID');
const M = v => (num(v)/1e9).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+' M';
const pct = v => (num(v)*100).toLocaleString('id-ID',{maximumFractionDigits:1})+'%';
const days = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/864e5);
const canWrite = sh => USER && (WRITE[USER.peran]||[]).includes(sh);
function toast(text, kind){ const t=$('#toast'); t.innerHTML=`<div class="msg ${kind||'info'}" role="status">${esc(text)}</div>`; clearTimeout(t._h); t._h=setTimeout(()=>t.innerHTML='',4500); }
function opt(list, val, blank){ return (blank?`<option value="">${esc(blank)}</option>`:'')+list.map(o=>{const v=typeof o==='object'?o.v:o, l=typeof o==='object'?o.l:o; return `<option value="${esc(v)}"${String(v)===String(val)?' selected':''}>${esc(l)}</option>`}).join(''); }

/* ===== Data ===== */
async function load(){
  if(CFG.api){
    try{
      const r = await fetch(CFG.api+'?token='+encodeURIComponent(CFG.token));
      const j = await r.json();
      if(!j.ok) throw new Error(j.error);
      D = j.data; USER = j.user;
      $('#mode').className='chip good'; $('#mode').textContent='Terhubung ke workbook MONITORING SKKI';
    }catch(e){
      D = null; $('#mode').className='chip bad'; $('#mode').textContent='Gagal terhubung';
      $('#view').innerHTML=`<div class="msg bad">Data tidak bisa dimuat: ${esc(e.message)}. Periksa URL API dan token di Pengaturan.</div>`; return;
    }
  } else if(DEMO_DATA){
    D = JSON.parse(JSON.stringify(DEMO_DATA)); USER = {nama:'Mode demo',peran:'Admin Ren',email:''};
    $('#mode').className='chip warn'; $('#mode').textContent='Mode demo: perubahan tidak tersimpan';
  } else {
    $('#mode').className='chip bad'; $('#mode').textContent='Belum terhubung';
    $('#view').innerHTML='<div class="msg info">Isi URL API Apps Script dan token Anda di Pengaturan untuk memuat data.</div>'; settings(); return;
  }
  ['PRK','SUB_PRK','PAGU_VERSI','PLOT_AKI','KATALOG','RENCANA_MATERIAL','KHS','PAKET','BOQ','DISPOSISI','KONTRAK','AMANDEMEN','PROGRES','BAYAR','PROGNOSA'].forEach(k=>D[k]=D[k]||[]);
  $('#who').textContent = USER.nama+' · '+USER.peran;
  calc(); route();
}
const KEY = {PRK:'id_prk',SUB_PRK:'id_sub',PAGU_VERSI:'id_versi',KATALOG:'id_item',RENCANA_MATERIAL:'id_rm',KHS:'id_khs',PAKET:'id_paket',BOQ:'id_boq',DISPOSISI:'id_disposisi',KONTRAK:'id_kontrak',AMANDEMEN:'id_amd',PROGRES:'id_progres',BAYAR:'id_bayar'};
const PFX = {PRK:'PRK',SUB_PRK:'SUB',PAGU_VERSI:'PV',KATALOG:'ITM',RENCANA_MATERIAL:'RM',KHS:'KHS',PAKET:'PKT',BOQ:'BOQ',DISPOSISI:'DSP',KONTRAK:'KTR',AMANDEMEN:'AMD',PROGRES:'PRG',BAYAR:'BYR'};
function localId(sh){ let m=0; D[sh].forEach(r=>{const x=String(r[KEY[sh]]||'').match(/(\d+)$/); if(x) m=Math.max(m,+x[1]);}); return PFX[sh]+'-'+String(m+1).padStart(3,'0'); }
async function save(sh, rec){
  if(!canWrite(sh)){ toast('Peran Anda tidak boleh mengubah data ini.','bad'); return null; }
  let out = rec;
  if(CFG.api){
    try{
      const r = await fetch(CFG.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:CFG.token,action:'upsert',sheet:sh,record:rec})});
      const j = await r.json(); if(!j.ok){ toast(j.error,'bad'); return null; } out = j.record;
    }catch(e){ toast('Gagal menyimpan: '+e.message,'bad'); return null; }
  } else if(KEY[sh] && !rec[KEY[sh]]) out = Object.assign({},rec,{[KEY[sh]]:localId(sh)});
  const k = KEY[sh];
  const i = k ? D[sh].findIndex(r=>r[k]===out[k]) : sh==='PLOT_AKI' ? D[sh].findIndex(r=>r.id_prk===out.id_prk&&num(r.bulan)===num(out.bulan)) : -1;
  if(i>=0) D[sh][i]=Object.assign({},D[sh][i],out); else D[sh].push(out);
  calc(); toast(CFG.api?'Tersimpan':'Tersimpan di mode demo (tidak masuk spreadsheet)','good');
  return out;
}

/* ===== Perhitungan ===== */
function calc(){
  const amd = {}; D.AMANDEMEN.forEach(a=>{ if(a.status==='Rencana') return; (amd[a.id_ref]=amd[a.id_ref]||[]).push(a); });
  const delta = id => (amd[id]||[]).reduce((s,a)=>s+num(a.nilai_sesudah)-num(a.nilai_sebelum),0);
  const paket = Object.fromEntries(D.PAKET.map(p=>[p.id_paket,p]));
  const kontrak = D.KONTRAK.map(k=>({...k, amd:delta(k.id_kontrak), berlaku:num(k.nilai_awal)+delta(k.id_kontrak), paket:paket[k.id_paket]||{}}));
  const kById = Object.fromEntries(kontrak.map(k=>[k.id_kontrak,k]));
  const bayarK = {}; D.BAYAR.forEach(b=>bayarK[b.id_kontrak]=(bayarK[b.id_kontrak]||0)+num(b.nilai));
  kontrak.forEach(k=>{ k.bayar=bayarK[k.id_kontrak]||0; k.fisik=fisik(k); });
  const sub = D.SUB_PRK.map(s=>{
    const ks = kontrak.filter(k=>k.id_sub===s.id_sub || (!k.id_sub && k.paket.id_sub===s.id_sub));
    const proses = D.PAKET.filter(p=>p.id_sub===s.id_sub && PRE.includes(p.status)).reduce((t,p)=>t+num(p.rab),0);
    const kon = ks.reduce((t,k)=>t+k.berlaku,0), byr = ks.reduce((t,k)=>t+k.bayar,0);
    return {...s, ai:num(s.ai_rencana), kontrak:kon, proses, sisa:num(s.ai_rencana)-kon-proses, bayar:byr, serapan:num(s.ai_rencana)?kon/num(s.ai_rencana):0};
  });
  const prk = D.PRK.map(p=>{
    const ss = sub.filter(s=>s.id_prk===p.id_prk);
    const sum = f => ss.reduce((t,s)=>t+s[f],0);
    const aki = D.PLOT_AKI.filter(a=>a.id_prk===p.id_prk).reduce((t,a)=>t+num(a.nilai),0) || num(p.aki);
    return {...p, subs:ss, ai:num(p.ai_terbit), rencana:sum('ai'), kontrak:sum('kontrak'), proses:sum('proses'), sisa:num(p.ai_terbit)-sum('kontrak')-sum('proses'), bayar:sum('bayar'), akiTotal:aki};
  });
  const khs = D.KHS.map(h=>{
    const d = delta(h.id_khs), last=(amd[h.id_khs]||[]).slice(-1)[0];
    const akhir = last && last.akhir_sesudah ? last.akhir_sesudah : h.akhir;
    const terpakai = kontrak.filter(k=>k.id_khs===h.id_khs).reduce((t,k)=>t+k.berlaku,0);
    const berlaku = num(h.nilai_awal)+d;
    return {...h, amd:d, berlaku, akhirBerlaku:akhir, terpakai, sisa:berlaku-terpakai, hidup: akhir ? akhir>=TODAY : true, sisaHari: akhir?days(TODAY,akhir):null};
  });
  C = {kontrak, kById, sub, prk, khs, amd, paket};
  C.tot = ['ai','kontrak','proses','sisa','bayar','akiTotal'].reduce((o,f)=>(o[f]=prk.reduce((t,p)=>t+num(p[f]),0),o),{});
  C.flags = flags();
}
function fisik(k){
  const boq = D.BOQ.filter(b=>b.id_paket===k.id_paket);
  if(!boq.length) return null;
  let tgt=0, done=0;
  boq.forEach(b=>{
    const h = num(b.harga)||num((D.KATALOG.find(i=>i.id_item===b.id_item)||{}).harga_satuan);
    const v = Math.max(0,...D.PROGRES.filter(p=>p.id_kontrak===k.id_kontrak&&p.id_item===b.id_item&&p.up3===b.up3).map(p=>num(p.vol_terpasang)));
    tgt += num(b.volume)*h; done += Math.min(v,num(b.volume))*h;
  });
  return tgt ? done/tgt : 0;
}
function flags(){
  const f=[];
  C.sub.filter(s=>s.sisa<0).forEach(s=>f.push({lv:'bad',t:'Perlu rekomposisi',d:`${s.uraian}: melebihi AI Rencana sebesar Rp ${rp(-s.sisa)}`,go:'#pagu'}));
  C.khs.filter(h=>h.hidup && h.sisa>1 && h.sisaHari!==null && h.sisaHari<=60).forEach(h=>f.push({lv:'warn',t:'KHS segera berakhir',d:`${h.uraian} (${h.pemenang}): sisa kuota Rp ${rp(h.sisa)}, berakhir ${h.akhirBerlaku}`,go:'#khs'}));
  D.PAKET.filter(p=>p.tgl_pr && p.tgl_nd_man && p.tgl_pr<p.tgl_nd_man).forEach(p=>f.push({lv:'warn',t:'Urutan tanggal',d:`${p.id_paket} ${(p.nama_paket||'').slice(0,60)}: PR (${p.tgl_pr}) sebelum ND Manajer (${p.tgl_nd_man})`,go:'#paket'}));
  C.kontrak.filter(k=>k.akhir && k.akhir<TODAY && !k.tgl_bast).forEach(k=>f.push({lv:'warn',t:'BAST belum diinput',d:`${k.no_kontrak||k.id_kontrak} (${k.vendor}): kontrak berakhir ${k.akhir}`,go:'#kontrak'}));
  D.PAKET.filter(p=>PRE.includes(p.status)).forEach(p=>{ const a=p.tgl_nd_user?days(p.tgl_nd_user,TODAY):null; if(a!==null&&a>30) f.push({lv:'warn',t:'Proses lama',d:`${p.id_paket} ${(p.nama_paket||'').slice(0,60)}: ${a} hari sejak ND User, status ${p.status}`,go:'#paket'}); });
  return f;
}

/* ===== Routing ===== */
const VIEWS = {dashboard:vDash, pagu:vPagu, paket:vPaket, kontrak:vKontrak, khs:vKhs, material:vMaterial, progres:vProgres, bayar:vBayar};
function route(){
  if(!D) return;
  const h = (location.hash||'#dashboard').slice(1); const v = VIEWS[h]?h:'dashboard';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+v));
  if(chart){ chart.destroy(); chart=null; }
  VIEWS[v]();
}
window.addEventListener('hashchange',route);

/* ===== Modal dan form ===== */
function modal(html){ $('#modal').innerHTML=html; $('#ov').classList.add('on'); const f=$('#modal').querySelector('input,select,textarea,button'); if(f) f.focus(); }
function close_(){ $('#ov').classList.remove('on'); }
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') close_(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close_(); });
function form(title, fields, rec, onSave, note){
  rec = rec||{};
  const inp = f => {
    const v = rec[f.k]!==undefined?rec[f.k]:(f.def!==undefined?f.def:'');
    const id='f_'+f.k;
    let el;
    if(f.type==='select') el=`<select id="${id}">${opt(f.options,v,f.blank)}</select>`;
    else if(f.type==='textarea') el=`<textarea id="${id}" rows="2">${esc(v)}</textarea>`;
    else el=`<input id="${id}" type="${f.type||'text'}" value="${esc(v)}"${f.type==='number'?' step="any" min="0"':''}${f.ro?' readonly':''}>`;
    return `<label class="${f.wide?'wide':''}" for="${id}">${esc(f.label)}${f.req?' *':''}${el}</label>`;
  };
  modal(`<div class="head"><h2>${esc(title)}</h2><button type="button" onclick="close_()" aria-label="Tutup">Tutup</button></div>
    ${note?`<div class="msg info">${note}</div>`:''}
    <form id="frm" class="form" novalidate>${fields.map(inp).join('')}<div class="wide" id="ferr"></div>
    <div class="wide row"><button class="primary" type="submit">Simpan</button><button type="button" onclick="close_()">Batal</button></div></form>`);
  $('#frm').addEventListener('submit', async e=>{
    e.preventDefault();
    const out = {...rec};
    for(const f of fields){ let v=$('#f_'+f.k).value.trim(); if(f.type==='number') v = v===''?'':Number(v); out[f.k]=v; }
    const miss = fields.filter(f=>f.req && (out[f.k]===''||out[f.k]===undefined)).map(f=>f.label);
    if(miss.length){ $('#ferr').innerHTML=`<div class="msg bad">Lengkapi: ${esc(miss.join(', '))}.</div>`; return; }
    const warn = onSave.check ? onSave.check(out) : null;
    if(warn && !out._ok){ $('#ferr').innerHTML=`<div class="msg warn">${warn}</div>`; out._ok=true; rec._ok=true; return; }
    delete out._ok; const r = await onSave(out); if(r!==false) close_();
  });
  $('#frm').addEventListener('input',()=>{ $('#ferr').innerHTML=''; rec._ok=false; });
}

  if(num(v)>num(b.volume)){ toast(`Volume terpasang melebihi BoQ (${b.volume}).`,'bad'); return; }
  const bulan=num($('#pb'+i).value);
  const prev=Math.max(0,...D.PROGRES.filter(p=>p.id_kontrak===PK&&p.id_item===b.id_item&&p.up3===b.up3&&num(p.bulan)<bulan).map(p=>num(p.vol_terpasang)));
  if(num(v)<prev){ toast(`Kumulatif tidak boleh turun dari bulan sebelumnya (${prev}).`,'bad'); return; }
  const ex=D.PROGRES.find(p=>p.id_kontrak===PK&&p.id_item===b.id_item&&p.up3===b.up3&&num(p.bulan)===bulan);
  const r=await save('PROGRES',{id_progres:ex?ex.id_progres:'',id_kontrak:PK,id_item:b.id_item,up3:b.up3,bulan,vol_terpasang:num(v),catatan_mdu:$('#pm'+i).value,kendala:$('#pd'+i).value,oleh:USER.email||USER.nama,tanggal_input:TODAY});
  if(r) vProgres();
}

/* ===== Tampilan: Pembayaran ===== */
function vBayar(){
  const bl=[...Array(12)].map((_,m)=>m+1);
  const real=m=>D.BAYAR.filter(b=>b.tgl_bayar&&+String(b.tgl_bayar).slice(5,7)===m).reduce((t,b)=>t+num(b.nilai),0);
  const plot=m=>D.PLOT_AKI.filter(a=>num(a.bulan)===m).reduce((t,a)=>t+num(a.nilai),0);
  let cr=0,cp=0;
  $('#view').innerHTML=`<div class="row"><h2>Pembayaran dan serapan kas</h2><div class="grow"></div>${canWrite('BAYAR')?'<button class="primary" type="button" onclick="editBayar()">Catat pembayaran</button>':''}${canWrite('PLOT_AKI')?'<button type="button" onclick="editAki()">Isi plot AKI</button>':''}</div>
  <div class="tiles"><div class="tile"><div class="l">Terbayar</div><div class="v">${M(C.tot.bayar)}</div></div><div class="tile"><div class="l">Belum terbayar dari nilai kontrak</div><div class="v">${M(C.kontrak.reduce((t,k)=>t+k.berlaku-k.bayar,0))}</div></div>
   <div class="tile"><div class="l">Siap tagih</div><div class="v">${C.kontrak.filter(k=>k.tgl_bast&&k.bayar<k.berlaku).length}</div><div class="n">kontrak sudah BAST, belum lunas</div></div></div>
  <div class="panel scroll"><h3>Realisasi kas vs plot AKI per bulan (Rp)</h3><table><thead><tr><th>Bulan</th><th class="n">Plot AKI</th><th class="n">Realisasi</th><th class="n">Kumulatif plot</th><th class="n">Kumulatif realisasi</th><th>Capaian kumulatif</th></tr></thead><tbody>
   ${bl.map(m=>{cr+=real(m);cp+=plot(m);return `<tr><td>${new Date(2026,m-1,1).toLocaleDateString('id-ID',{month:'long'})}</td><td class="n">${rp(plot(m))}</td><td class="n">${rp(real(m))}</td><td class="n">${rp(cp)}</td><td class="n">${rp(cr)}</td><td>${cp?meter(cr/cp):'<span class="muted">plot belum diisi</span>'}</td></tr>`}).join('')}</tbody></table></div>
  <div class="panel scroll"><h3>Daftar pembayaran</h3>${D.BAYAR.length?`<table><thead><tr><th>Tgl bayar</th><th>Kontrak</th><th>Vendor</th><th>Termin</th><th class="n">Nilai</th><th></th></tr></thead><tbody>${D.BAYAR.slice().sort((a,b)=>String(b.tgl_bayar).localeCompare(a.tgl_bayar)).map(b=>{const k=C.kById[b.id_kontrak]||{};return `<tr><td>${esc(b.tgl_bayar)}</td><td class="mono" style="font-size:12px">${esc(k.no_kontrak)}</td><td>${esc(k.vendor)}</td><td>${esc(b.termin)}</td><td class="n">${rp(b.nilai)}</td><td>${canWrite('BAYAR')?`<button type="button" onclick="editBayar('${b.id_bayar}')">Ubah</button>`:''}</td></tr>`}).join('')}</tbody></table>`:'<div class="muted">Belum ada pembayaran tercatat untuk 2026.</div>'}</div>`;
}
function editBayar(id){
  const b=id?D.BAYAR.find(x=>x.id_bayar===id):{termin:'Termin 1'};
  form(id?'Ubah pembayaran':'Catat pembayaran',[{k:'id_kontrak',label:'Kontrak',type:'select',options:C.kontrak.map(k=>({v:k.id_kontrak,l:`${k.no_kontrak} · ${k.vendor} (sisa Rp ${rp(k.berlaku-k.bayar)})`})),req:1,wide:1},
   {k:'termin',label:'Termin',type:'select',options:['Termin 1','Termin 2','Termin 3','Pelunasan','Bulanan']},{k:'tgl_tagih',label:'Tanggal tagih',type:'date'},{k:'tgl_bayar',label:'Tanggal bayar',type:'date',req:1},{k:'nilai',label:'Nilai bayar (Rp)',type:'number',req:1},{k:'bukti',label:'Bukti / nomor dokumen',wide:1}],b,
  Object.assign(async o=>{ const k=C.kById[o.id_kontrak]; o.id_sub=k.id_sub||k.paket.id_sub; o.oleh=USER.email||USER.nama;
    const sudah=D.BAYAR.filter(x=>x.id_kontrak===o.id_kontrak&&x.id_bayar!==o.id_bayar).reduce((t,x)=>t+num(x.nilai),0);
    if(sudah+num(o.nilai)>k.berlaku+1){ toast(`Total bayar melebihi nilai kontrak berlaku (Rp ${rp(k.berlaku)}).`,'bad'); return false; }
    const r=await save('BAYAR',o); if(!r) return false;
    if(sudah+num(o.nilai)>=k.berlaku-1) await save('PAKET',{...k.paket,status:'Terbayar'}); route(); },
   {check:o=>o.tgl_tagih&&o.tgl_bayar&&o.tgl_tagih>o.tgl_bayar?'Tanggal tagih setelah tanggal bayar. Klik Simpan lagi untuk tetap menyimpan.':null}));
}
function editAki(){
  form('Isi plot AKI per bulan',[{k:'id_prk',label:'PRK',type:'select',options:D.PRK.map(p=>({v:p.id_prk,l:p.no_prk+' '+p.uraian})),req:1,wide:1}].concat([...Array(12)].map((_,m)=>({k:'b'+(m+1),label:new Date(2026,m,1).toLocaleDateString('id-ID',{month:'long'})+' (Rp)',type:'number',def:0}))),{},
  async o=>{ for(let m=1;m<=12;m++){ const ex=D.PLOT_AKI.find(a=>a.id_prk===o.id_prk&&num(a.bulan)===m); if(num(o['b'+m])||ex){ const r=await save('PLOT_AKI',{id_prk:o.id_prk,bulan:m,nilai:num(o['b'+m])}); if(!r) return false; } } route(); });
}

/* ===== Pengaturan ===== */
function settings(){
  modal(`<div class="head"><h2>Pengaturan koneksi</h2><button type="button" onclick="close_()">Tutup</button></div>
  <div class="msg info">URL API adalah alamat /exec dari deployment Apps Script. Token pribadi diberikan Admin Ren dari sheet PENGGUNA. Keduanya hanya disimpan di browser ini.</div>
  <form id="sf" class="form"><label class="wide" for="s_api">URL API Apps Script<input id="s_api" value="${esc(CFG.api)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
  <label class="wide" for="s_tok">Token<input id="s_tok" type="password" value="${esc(CFG.token)}"></label>
  <div class="wide row"><button class="primary" type="submit">Simpan dan muat</button>${DEMO_DATA?'<button type="button" id="s_demo">Pakai mode demo</button>':''}</div></form>`);
  $('#sf').addEventListener('submit',e=>{e.preventDefault(); CFG={api:$('#s_api').value.trim(),token:$('#s_tok').value.trim()}; try{localStorage.setItem('aiao_cfg',JSON.stringify(CFG));}catch(x){} close_(); load();});
  const dm=$('#s_demo'); if(dm) dm.addEventListener('click',()=>{CFG={api:'',token:''}; try{localStorage.removeItem('aiao_cfg');}catch(x){} close_(); load();});
}
$('#btnSetting').addEventListener('click',settings);
$('#btnReload').addEventListener('click',load);
load();
</script>
